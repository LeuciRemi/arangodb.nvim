name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check lua plugin tests ftplugin

  test:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.10.4, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - run: make test
      - name: Check generated help tags
        if: matrix.neovim == 'stable'
        run: |
          make docs
          git diff --exit-code doc/tags

  dependency-smoke-test:
    name: Snacks ${{ matrix.snacks }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        snacks: [v2.31.0, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          version: stable
          neovim: true
      - run: git clone --depth 1 --branch ${{ matrix.snacks }} https://github.com/folke/snacks.nvim.git /tmp/snacks.nvim
      - run: >-
          nvim --clean --headless -u tests/minimal_init.lua
          "+set runtimepath+=/tmp/snacks.nvim"
          -l tests/snacks_smoke.lua

  integration:
    name: ArangoDB 3.12 integration
    runs-on: ubuntu-latest
    services:
      arangodb:
        image: arangodb:3.12.13
        env:
          ARANGO_ROOT_PASSWORD: integration-password
        ports:
          - 8529:8529
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          version: stable
          neovim: true
      - name: Wait for ArangoDB
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --user root:integration-password http://127.0.0.1:8529/_api/version >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: make integration
        env:
          ARANGODB_TEST_URL: http://root:integration-password@127.0.0.1:8529/_system
