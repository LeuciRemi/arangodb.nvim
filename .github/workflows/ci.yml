name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua plugin tests

  test:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.10.4, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - run: make test

  dependency-smoke-test:
    name: Snacks v2.31.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          version: stable
          neovim: true
      - run: git clone --depth 1 --branch v2.31.0 https://github.com/folke/snacks.nvim.git /tmp/snacks.nvim
      - run: >-
          nvim --clean --headless -u tests/minimal_init.lua
          "+set runtimepath+=/tmp/snacks.nvim"
          -l tests/snacks_smoke.lua
